# ─────────────────────────────────────────────────────────────────────────────
# Multi-Broker Portfolio Tracker — production Compose stack
#
# Services:
#   backend      – FastAPI proxy service (built from backend/Dockerfile)
#   ibkr-gateway – IB Gateway sidecar (Client Portal API over HTTPS)
#   futu-opend   – Futu OpenD sidecar (OpenAPI over TCP)
#
# All services share the mbp-net bridge network.  Gateway ports are exposed
# only to backend — they are NOT published to the host in this file.
#
# See infra/README.md for credentials, first-run instructions, and the smoke
# test.  Copy .env.example → .env and fill in your values before running.
# ─────────────────────────────────────────────────────────────────────────────

networks:
  mbp-net:
    driver: bridge

volumes:
  ibkr-state:
    driver: local
  # OpenD's real state directory. See the futu-opend service for why the
  # path matters.
  futu-opend-home:
    # Declared external: it is seeded once with OpenD's device trust and
    # must survive `docker-compose down -v`. Losing it costs a fresh SMS
    # verification, which would break unattended syncs.
    external: true
    name: futu-opend-home

services:

  # ── FastAPI backend ─────────────────────────────────────────────────────────
  # backend shares futu-opend's network namespace so OpenD can listen on
  # 127.0.0.1 (no encryption required for "local" trade calls). The
  # backend reaches OpenD via localhost:11111. Side effect: backend has
  # no networks/ports of its own — all port publishing for the API
  # (8000) is done on the futu-opend service below.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: mbp-backend:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MBP_IB_GATEWAY_HOST: ibkr-gateway
      # gnzsnz image binds the Java API to 127.0.0.1 inside the container
      # and exposes it to peers via socat on a shifted port:
      #   live  : Java 4001 → socat 4003   (TrustedIPs=127.0.0.1 only accepts
      #   paper : Java 4002 → socat 4004    the loopback hop from socat)
      # Connect to 4003/4004, NOT 4001/4002 — direct hits to 4001 succeed at
      # TCP level but are dropped by the API layer.
      MBP_IB_GATEWAY_PORT: "${IBKR_API_PORT:-4003}"
      MBP_FUTU_OPEND_HOST: 127.0.0.1
      MBP_FUTU_OPEND_PORT: "11111"
    volumes:
      - ./infra/futu-opend/conn_key.pem:/secrets/futu_conn_key.pem:ro
      - ./backend/.secrets:/home/mbp/.secrets
    # The backend used to run INSIDE futu-opend's network namespace so
    # OpenD would see it as a local (127.0.0.1) client. That coupling is
    # gone: it meant OpenD had to be running whenever the backend was,
    # which is incompatible with running OpenD only during the sync
    # window (spec §4.3 rule 3), and it forced port 8000 to be published
    # on futu-opend, which §11.2 forbids.
    #
    # Futu now runs as an ephemeral job that shares OpenD's namespace for
    # the length of one sync (see infra/futu-opend/sync-futu.sh). The
    # backend keeps ordinary networking.
    ports:
      - "${BACKEND_BIND_IP:-127.0.0.1}:8000:8000"
    networks:
      - mbp-net
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; urllib.request.urlopen('http://localhost:8000/healthz',timeout=4); sys.exit(0)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  # ── IB Gateway sidecar ──────────────────────────────────────────────────────
  # Custom image — adapted from gnzsnz/ib-gateway-docker (Apache-2.0).
  # No manual downloads needed; the Dockerfile fetches a SHA256-verified
  # archive of the offline IB Gateway installer at build time.
  # See infra/ibkr-gateway/README.md.
  #
  # IMPORTANT: Supply IBKR_USERNAME, IBKR_PASSWORD, and
  # IBKR_TRADING_MODE (paper|live) in your .env file.
  ibkr-gateway:
    build:
      context: ./infra/ibkr-gateway
      dockerfile: Dockerfile
    image: mbp-ibkr-gateway:latest
    container_name: mbp-ibkr-gateway
    restart: unless-stopped
    environment:
      # gnzsnz scripts read these env var names:
      TWS_USERID: "${IBKR_USERNAME:-}"
      TWS_PASSWORD: "${IBKR_PASSWORD:-}"
      TRADING_MODE: "${IBKR_TRADING_MODE:-paper}"
      READ_ONLY_API: "yes"
      TWOFA_TIMEOUT_ACTION: "exit"
      BYPASS_WARNING: "yes"
      AUTO_RESTART_TIME: "11:59 PM"
      TIME_ZONE: "Etc/UTC"
      # If another IB session is logged in elsewhere (phone, desktop),
      # take over from it instead of waiting for human intervention.
      EXISTING_SESSION_DETECTED_ACTION: "primary"
      # Auto-accept the API "Allow incoming connections?" dialog —
      # without this, Gateway sits with the dialog open and the
      # API socket never binds, so port 4001 has no listener.
      TWS_ACCEPT_INCOMING: "accept"
      ALLOW_BLIND_TRADING: "no"
      SAVE_TWS_SETTINGS: ""
      TWS_COLD_RESTART: ""
      AUTO_LOGOFF_TIME: ""
      TWOFA_DEVICE: ""
      TWOFA_EXIT_INTERVAL: ""
      RELOGIN_AFTER_TWOFA_TIMEOUT: ""
      TWS_MASTER_CLIENT_ID: ""
    # API socket exposed only on mbp-net (peer containers reach via
    # `ibkr-gateway` hostname). Not published to the host.
    expose:
      - "4001"
      - "4002"
    volumes:
      - ibkr-state:/root/Jts/settings
    networks:
      - mbp-net

  # ── Futu OpenD sidecar ──────────────────────────────────────────────────────
  # Custom image — built locally from Futu's official Linux OpenD binary.
  # Before the first build you must download OpenD.tar.gz and place it at
  # `infra/futu-opend/OpenD.tar.gz`. See `infra/futu-opend/README.md`.
  #
  # IMPORTANT: You must supply FUTU_OPEND_LOGIN_ACCOUNT and
  # FUTU_OPEND_LOGIN_PASSWORD_MD5 in your .env file.
  futu-opend:
    build:
      context: ./infra/futu-opend
      dockerfile: Dockerfile
    image: mbp-futu-opend:latest
    # Pinned name so the ephemeral sync job's
    # `--network container:mbp-futu-opend` resolves the same way across
    # compose versions.
    container_name: mbp-futu-opend
    # The FutuOpenD binary is x86_64-only. Force amd64 so the container
    # runs under Rosetta on Apple-silicon Macs; on a native x86_64 host
    # this is a no-op.
    platform: linux/amd64
    # NOT restarted automatically, and NOT started with the stack.
    # §4.3 rule 3: OpenD holds a logged-in broker session, so it runs
    # only during the sync window. Bring it up with:
    #     infra/futu-opend/sync-futu.sh
    # which starts it, runs the sync in a container sharing its network
    # namespace, and stops it again.
    restart: "no"
    profiles: ["futu"]
    environment:
      FUTU_OPEND_LOGIN_ACCOUNT: "${FUTU_OPEND_LOGIN_ACCOUNT:-}"
      FUTU_OPEND_LOGIN_PASSWORD_MD5: "${FUTU_OPEND_LOGIN_PASSWORD_MD5:-}"
      # Must stay 127.0.0.1. Verified 2026-09-06: with 0.0.0.0, OpenD
      # rejects every trade_ctx call — including read-only ones — with
      # "cross-network trade connections must be encrypted". That is not
      # specific to unlock_trade, so removing unlock did not lift it.
      # Enabling RSA would, but the encrypted handshake was previously
      # found unstable (see this file's history), and the ephemeral sync
      # job avoids needing it at all.
      FUTU_OPEND_LISTEN_IP: "127.0.0.1"
    # NO `ports:` — §11.2 requires futu-opend to publish nothing at all.
    # The sync job reaches OpenD over the shared namespace on localhost;
    # the SMS telnet console is reached with `docker exec` when needed.
    volumes:
      # MUST be /root/.com.futunn.FutuOpenD — that is where OpenD
      # actually persists state, including the device trust that stops it
      # demanding a fresh SMS code on every start. The old mount at
      # /opt/OpenD/data held nothing OpenD uses, which is why every
      # container recreation used to re-trigger SMS verification and made
      # an ephemeral OpenD unworkable.
      - futu-opend-home:/root/.com.futunn.FutuOpenD
    networks:
      - mbp-net
