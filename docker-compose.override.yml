# ─────────────────────────────────────────────────────────────────────────────
# docker-compose.override.yml — local development overrides
#
# Applied automatically by `docker compose up` on top of docker-compose.yml.
# Do NOT commit secrets here.
#
# Key changes vs. production:
#   • backend source tree mounted for hot-reload with --reload.
#   • Broker adapter env vars set to "disabled" so IBKR/Futu sidecars are
#     optional (they still start but the adapters skip real connections).
#   • Auth disabled so you can hit the API without a Firebase ID token.
#   • Firebase emulator endpoint wired in.
# ─────────────────────────────────────────────────────────────────────────────

services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    # Mount source for hot-reload (overrides the baked-in copy).
    volumes:
      - ./backend/app:/app/app:ro
      # Persist the file-backed KMS master key across container rebuilds
      # so already-encrypted credential blobs in Firestore remain
      # decryptable. Host path matches the existing key in backend/.secrets/.
      - ./backend/.secrets:/home/mbp/.secrets
    command:
      - uvicorn
      - app.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --reload
    environment:
      MBP_ENV: development
      MBP_LOG_LEVEL: DEBUG
      # Skip real broker connections in dev — set adapters to disabled mode.
      IBKR_ADAPTER: disabled
      FUTU_ADAPTER: disabled
    # No `ports:` here — the base compose file publishes 8000 on the
    # backend itself now. (It used to be published by futu-opend because
    # the backend lived inside its network namespace; that coupling was
    # removed so OpenD can be ephemeral — §4.3 rule 3.)

  # Sidecars still start so the compose graph is valid, but credentials are
  # blank — they will fail to connect to real IBKR/Futu endpoints, which is
  # intentional for local dev.
  ibkr-gateway:
    environment:
      IBKR_USERNAME: "dev-placeholder"
      IBKR_PASSWORD: "dev-placeholder"
      IBKR_TRADING_MODE: paper

  # futu-opend reads its credentials from .env via the base compose file
  # so we can iterate against a real Futu account in local dev. To run
  # with placeholders, re-add the overrides here.

  # ── Firebase Local Emulator Suite ───────────────────────────────────────────
  firebase-emulator:
    image: andreysenov/firebase-tools:latest
    restart: unless-stopped
    working_dir: /firebase
    volumes:
      - ./firebase:/firebase:ro
    # Start Auth, Firestore, and Storage emulators; export data on shutdown so
    # state survives restarts.
    command:
      - firebase
      - emulators:start
      - --only
      - auth,firestore,storage
      - --project
      - demo-mbp-local
      - --export-on-exit=/firebase/emulator-data
      - --import=/firebase/emulator-data
    # Bound to loopback, not 0.0.0.0. This override file is loaded
    # AUTOMATICALLY by docker-compose, including on the NAS, so an
    # unqualified `docker-compose up` here would otherwise expose four
    # emulator ports to the LAN — §11.2 forbids that, and an auth
    # emulator on an open port is a particularly bad one to leak.
    # Loopback is fully usable for local dev.
    ports:
      - "127.0.0.1:4000:4000"   # Emulator Hub UI
      - "127.0.0.1:9099:9099"   # Auth emulator
      - "127.0.0.1:8080:8080"   # Firestore emulator
      - "127.0.0.1:9199:9199"   # Storage emulator
    networks:
      - mbp-net
